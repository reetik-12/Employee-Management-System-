<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Employee Management System</h1>
    <button id="addEmployeeBtn">Add Employee</button>

    <table id="employeeTable">
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Email</th><th>Salary</th><th>Mobile No</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Employees will be inserted here -->
      </tbody>
    </table>
  </div>

  <!-- Add/Edit Employee Modal -->
  <div id="employeeModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="formTitle">Add Employee</h2>
      <form id="employeeForm">
        <input type="hidden" id="empId">
        <label>Name:</label>
        <input type="text" id="name" required><br>
        <label>Email:</label>
        <input type="email" id="email" required><br>
        <label>Salary:</label>
        <input type="text" id="salary" required><br>
        <label>Mobile No:</label>
        <input type="text" id="mobno" required><br>
        <button type="submit">Save</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
